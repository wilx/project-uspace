name: Build package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            acl \
            fonts-dejavu-core \
            fonts-sil-charis \
            fonts-texgyre \
            latexmk \
            lmodern \
            python3 \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-luatex \
            texlive-xetex

      - name: Run regression tests
        run: |
          bash tests/test-line-separators.sh
          python3 tests/test-packaging.py

      - name: Build CTAN archive
        run: bash ./uspace-ctanify.sh

      - name: Upload CTAN archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: uspace.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
